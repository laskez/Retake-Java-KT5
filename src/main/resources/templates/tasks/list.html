<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}">Список задач</title>
    <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/morph/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">Список задач</a>
        <div class="navbar-nav">
            <a class="nav-link" href="/">Главная</a>
            <a class="nav-link" href="/tasks">Задачи</a>
            <a class="nav-link" href="/about">О приложении</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h1 th:text="${title}">Список задач</h1>

    <a href="/tasks/new" class="btn btn-success mb-3">Добавить задачу</a>

    <p th:if="${tasks.isEmpty()}" class="text-muted">Пока задач нет.</p>

    <table class="table table-striped" th:unless="${tasks.isEmpty()}">
        <thead>
        <tr>
            <th>ID</th>
            <th>Название</th>
            <th>Описание</th>
            <th>Категория</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="task : ${tasks}">
            <td th:text="${task.id}">1</td>
            <td th:text="${task.title}">Название</td>
            <td th:text="${task.description}">Описание</td>
            <td th:text="${task.category != null ? task.category.name : '—'}">—</td>
            <td>
                <a th:href="@{/tasks/{id}/edit(id=${task.id})}" class="btn btn-sm btn-primary">Изменить</a>
                <form th:action="@{/tasks/{id}/delete(id=${task.id})}" method="post" style="display:inline;">
                    <button type="submit" class="btn btn-sm btn-danger"
                            onclick="return confirm('Удалить задачу?')">Удалить</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>

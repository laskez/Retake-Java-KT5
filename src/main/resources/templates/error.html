<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ошибка</title>
    <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/morph/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">Список задач</a>
        <div class="navbar-nav">
            <a class="nav-link" href="/">Главная</a>
            <a class="nav-link" href="/tasks">Задачи</a>
            <a class="nav-link" href="/about">О приложении</a>
        </div>
    </div>
</nav>

<div class="container mt-5 text-center">
    <h1 class="display-1 text-danger" th:text="${errorCode}">Ошибка</h1>
    <p class="lead" th:text="${errorMessage}">Что-то пошло не так</p>
    <a href="/" class="btn btn-primary mt-3">На главную</a>
</div>
</body>
</html>
